name: Build test module

on:
  workflow_dispatch:
  push:
    branches:
      - feat/app-scoped-dns-hijack
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n customize.sh
          bash -n box/scripts/box.iptables
          bash -n box/scripts/box.service
          bash -n box/scripts/box.tool

      - name: Guard UID and GID separation
        shell: bash
        run: |
          if grep -F 'printf "%s\\n" "${gid_list[@]}" >> "${uid_list}"' box/scripts/box.service; then
            echo "gid_list must never be appended to appuid.list"
            exit 1
          fi
          grep -F '保持独立，不写入 appuid.list' box/scripts/box.service

      - name: Validate default Mihomo DNS policy
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.load_file("box/mihomo/config.yaml")'
          grep -F "'https://doh.cleanbrowsing.org/doh/security-filter/#国外代理'" box/mihomo/config.yaml
          grep -F "'https://1.1.1.1/dns-query#国外代理'" box/mihomo/config.yaml
          grep -F "'https://1.0.0.1/dns-query#国外代理'" box/mihomo/config.yaml
          grep -F "'https://dns.google/dns-query#国外代理'" box/mihomo/config.yaml
          grep -F "'https://dns.quad9.net/dns-query#国外代理'" box/mihomo/config.yaml
          grep -F 'https://223.5.5.5/dns-query' box/mihomo/config.yaml
          grep -F 'https://1.12.12.12/dns-query' box/mihomo/config.yaml
          if grep -q '^[[:space:]]*nameserver-policy:' box/mihomo/config.yaml; then
            echo "default Mihomo config must not split app DNS back to domestic resolvers"
            exit 1
          fi

      - name: Validate split-apps DNS safety
        shell: bash
        run: |
          bash -n box/scripts/dns-rescue.sh
          grep -F 'dns_mode_is_split_apps()' box/scripts/box.iptables
          grep -F 'Foreign AGH 与 Mihomo DNS 均不可用' box/scripts/box.iptables
          grep -F 'Domestic AGH' box/scripts/box.iptables
          grep -F 'renew-dns' box/scripts/box.iptables
          grep -F 'dns_hijack_mode="split-apps"' <(sed 's/dns_hijack_mode="tproxy"/dns_hijack_mode="split-apps"/' box/settings.ini)
          grep -F 'domestic_dns_port="5591"' box/settings.ini
          grep -F 'foreign_dns_port="5592"' box/settings.ini
          grep -F 'cache-algorithm: arc' box/mihomo/config.yaml
          grep -F 'apply-apps)' box/scripts/box.service
          grep -F 'apply_app_rules()' box/scripts/box.service
          grep -F 'blacklist|black)' box/scripts/box.iptables
          grep -F '黑名单应用 -> Domestic AGH，其余 -> Foreign AGH' box/scripts/box.iptables
          if grep -q '^updateJson=' module.prop; then
            echo "fork module.prop must not expose upstream updateJson"
            exit 1
          fi

      - name: Bundle pinned boxbpf
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/boxproxy/boxproxy/releases/download/v0.0.2/boxbpf-arm64-v8a"
          expected="d9f9545419ac9ce363dde1cd101cf0919ae15ed38ab68e54295634c7694c73b1"
          curl -fL "$url" -o box/bin/boxbpf
          echo "$expected  box/bin/boxbpf" | sha256sum -c -
          chmod 0755 box/bin/boxbpf

      - name: Build module ZIP
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh box-*.zip

      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: box-app-scoped-dns-test
          path: box-*.zip
          if-no-files-found: error
